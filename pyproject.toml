[project]
name = "medrag"
version = "0.1.0"
description = "Tıbbi dokümanlar üzerinde RAG ile sohbet asistanı"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx2>=2"]
# Yerel embedding (BGE-M3). CUDA'lı torch için önce:
#   pip install torch --index-url https://download.pytorch.org/whl/cu124
vision = ["Pillow>=10"]  # tahlil fotoğrafı ön işleme (isteğe bağlı; yoksa atlanır)
local = ["torch>=2.4", "transformers>=4.56"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: gerçek model ve GPU ister (MEDRAG_GPU_TEST=1 ile çalışır)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["SIM115", "ISC004", "B023", "RUF059"]  # tek seferlik ölçüm betikleri

[tool.setuptools.package-data]
medrag = ["web/*.html", "web/static/*", "web/static/**/*"]
