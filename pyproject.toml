[project]
name = "medrag"
version = "0.1.0"
description = "Tıbbi dokümanlar üzerinde RAG ile sohbet asistanı"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
embed = ["sentence-transformers>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
