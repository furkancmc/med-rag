name: Veri çek

# MedlinePlus ve Vikipedi verisini indirip data/raw altına commit'ler.
# Elle (Actions sekmesi) çalıştırılabilir; bu dosya değişince de bir kez çalışır.
on:
  workflow_dispatch:
  push:
    branches: [ccr-fc8175dc-sqyb1k]
    paths: [.github/workflows/fetch-data.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m medrag.ingest medlineplus
      - run: python -m medrag.ingest wikipedia --lang tr --limit 500
        continue-on-error: true
      - run: python -m medrag.ingest wikipedia --lang en --limit 500
        continue-on-error: true
      - run: python -m medrag.ingest build
        if: ${{ !cancelled() }}
      - name: Ham veriyi commit'le
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f data/raw
          git commit -m "Ham tıbbi veri indirildi (MedlinePlus, Vikipedi)" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
