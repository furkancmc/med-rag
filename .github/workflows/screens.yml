name: Ekran görüntüsü

# Gerçek uygulamayı gerçek API ile açar, telefon boyutunda soru sorar, görüntüleri docs/screens altına commit'ler.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVREN_API_KEY: ${{ secrets.EVREN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . playwright
      - run: playwright install --with-deps chromium
      - name: Sunucuyu başlat
        run: |
          python -m medrag.api > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 1; done
      - run: python scripts/screens.py docs/screens
      - name: Görüntüleri commit'le
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/screens
          git commit -m "Gerçek uygulamadan ekran görüntüleri" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
