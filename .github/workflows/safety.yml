name: Güvenlik ve uçtan uca test

# Gerçek indeks ve Evren API ile: (1) FastAPI sunucusunu açıp /chat akışını dener,
# (2) güvenlik / kaynağa sadakat senaryolarını çalıştırır. Sadece elle çalıştırılır.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVREN_API_KEY: ${{ secrets.EVREN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: API duman testi (/chat akışı)
        run: |
          python -m medrag.api > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sN -X POST localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"message":"Diyabetin belirtileri nelerdir?"}' | tee smoke.txt
          grep -q '"type": "sources"' smoke.txt
          grep -q '"type": "done"' smoke.txt
          ! grep -q '"type": "error"' smoke.txt || { echo "chat hata verdi"; cat server.log; exit 1; }
      - name: Güvenlik senaryoları
        run: python -m medrag.eval safety
      - name: Sonuçları commit'le
        if: ${{ always() }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add eval/safety_results.md
          git commit -m "Güvenlik senaryo sonuçları" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
