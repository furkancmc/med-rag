name: API denemesi

# Embedding API'sine birkaç gerçek istek atar; süre ve hata bilgisini loga yazar (anahtar yazılmaz).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVREN_API_KEY: ${{ secrets.EVREN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m medrag.ingest build
      - run: python -m medrag.index check
