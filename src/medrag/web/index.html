<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sağlık Asistanı</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #1b1f24; --muted: #5d6671; --line: #e1e5ea;
    --accent: #0f766e; --accent-text: #fff; --user: #0f766e; --user-text: #fff;
    --danger-bg: #fdecec; --danger: #a61b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418; --surface: #1a2027; --text: #e8ecf0; --muted: #98a2ad; --line: #2b333c;
      --accent: #2dd4bf; --accent-text: #052e2b; --user: #0f766e; --user-text: #fff;
      --danger-bg: #3a1b1b; --danger: #ff9b9b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 0 0 8px; padding-left: 20px; }
  .msg em { color: var(--muted); font-size: 14px; }
  .cite { font-size: 12px; vertical-align: super; color: var(--accent); text-decoration: none; font-weight: 600; }
  .emergency { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); font-weight: 600; }
  .sources { align-self: flex-start; max-width: 88%; font-size: 13px; color: var(--muted); }
  .sources summary { cursor: pointer; padding: 4px 0; }
  .sources ol { margin: 4px 0 0; padding-left: 20px; }
  .sources li { margin-bottom: 6px; }
  .sources a { color: var(--accent); }
  .typing { color: var(--muted); font-size: 14px; }
  .hints { display: flex; flex-wrap: wrap; gap: 8px; }
  .hints button {
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  form {
    display: flex; gap: 8px; padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  form .row { max-width: 720px; margin: 0 auto; width: 100%; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font: inherit; background: var(--bg); color: var(--text); max-height: 140px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  #send {
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px;
    padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Sağlık Asistanı</h1>
  <p>Genel bilgilendirme amaçlıdır; doktor muayenesinin yerini tutmaz. Acil durumda 112.</p>
</header>
<main id="main"><div class="wrap" id="chat">
  <div class="msg bot"><p>Merhaba! Sağlıkla ilgili merak ettiğiniz bir şeyi sorabilirsiniz. Cevaplarımı kaynaklara dayandırır ve kaynakları gösteririm.</p></div>
  <div class="hints" id="hints"></div>
</div></main>
<form id="form"><div class="row">
  <textarea id="input" rows="1" maxlength="2000" placeholder="Sorunuzu yazın…" aria-label="Sorunuz"></textarea>
  <button id="send" type="submit">Gönder</button>
</div></form>

<script>
const chat = document.getElementById("chat");
const main = document.getElementById("main");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];
const HINTS = ["Diyabetin belirtileri nelerdir?", "Yüksek tansiyon için neler yapılabilir?", "Migren ile baş ağrısı arasındaki fark nedir?"];

for (const h of HINTS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = h;
  b.onclick = () => { input.value = h; form.requestSubmit(); };
  document.getElementById("hints").appendChild(b);
}

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// Çok küçük bir markdown işleyici: **kalın**, _italik_, "- " listeleri, [n] atıfları.
function render(text) {
  const lines = esc(text).split("\n");
  let html = "", list = false;
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\s)_(.+?)_(?=\s|$|[.,;])/g, "$1<em>$2</em>")
    .replace(/\[(\d+)\]/g, '<a class="cite" href="#src-$1">[$1]</a>');
  for (const line of lines) {
    const m = line.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!list) { html += "<ul>"; list = true; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (line.trim()) html += "<p>" + inline(line) + "</p>";
  }
  return html + (list ? "</ul>" : "");
}

function addMsg(cls, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls; el.innerHTML = html;
  chat.appendChild(el); main.scrollTop = main.scrollHeight;
  return el;
}

function addSources(items) {
  if (!items.length) return;
  const d = document.createElement("details");
  d.className = "sources";
  d.innerHTML = "<summary>Kaynaklar (" + items.length + ")</summary><ol>" + items.map(s =>
    '<li id="src-' + s.n + '"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) +
    "</a> <span>— " + esc(s.source) + ", " + esc(s.license) + "</span></li>").join("") + "</ol>";
  chat.appendChild(d);
}

async function ask(question) {
  document.getElementById("hints")?.remove();
  addMsg("user", esc(question));
  const bot = addMsg("bot", '<span class="typing">Yanıt hazırlanıyor…</span>');
  let answer = "", sources = [];
  send.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question, history: history.slice(-12) }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!raw.startsWith("data:")) continue;
        const ev = JSON.parse(raw.slice(5));
        if (ev.type === "emergency") {
          const e = document.createElement("div");
          e.className = "msg bot emergency"; e.innerHTML = render(ev.text);
          chat.insertBefore(e, bot);
        } else if (ev.type === "sources") sources = ev.items;
        else if (ev.type === "token") { answer += ev.text; bot.innerHTML = render(answer); }
        else if (ev.type === "error") bot.innerHTML = render(ev.text);
        main.scrollTop = main.scrollHeight;
      }
    }
    if (answer) { history.push({ role: "user", content: question }, { role: "assistant", content: answer }); }
    addSources(sources);
  } catch (err) {
    bot.innerHTML = render("Bağlantı sorunu oluştu, lütfen tekrar deneyin.");
  } finally {
    send.disabled = false; input.focus(); main.scrollTop = main.scrollHeight;
  }
}

const form = document.getElementById("form");
form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = ""; input.style.height = "auto";
  ask(q);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
</script>
</body>
</html>
