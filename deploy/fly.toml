app = "medrag"
primary_region = "fra"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "8000"
  WEB_CONCURRENCY = "1"
  MEDRAG_TRUST_PROXY_HEADERS = "1"
  MEDRAG_CLIENT_IP_HEADER = "fly-client-ip"
  MEDRAG_HSTS = "1"
  MEDRAG_WARMUP = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "feedback"
  destination = "/app/data/feedback"
